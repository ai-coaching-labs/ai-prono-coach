[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prono-coach"
version = "0.3.6"
description = "Workspace privé de coaching de pronostics, calculs déterministes et agents explicatifs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
prono = "prono.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
