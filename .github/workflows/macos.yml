name: macOS build

on:
  workflow_call:
    outputs:
      version:
        description: Version vérifiée du DMG
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Universal DMG
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read and check version
        id: version
        run: |
          version="$(python .github/scripts/check_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install engine with MCP
        run: python -m pip install -e '.[mcp]'
      - name: Run tests including Swift navigation
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build universal application and DMG
        run: bash scripts/build-macos-dmg.sh
      - name: Verify payload, architectures, signatures and disk image
        shell: bash
        run: |
          apps=(dist/macos-*/"AI Prono Coach.app")
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          python .github/scripts/verify_macos.py "$app"
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/AI Prono Coach" -verify_arch "$arch"
          done
          codesign --verify --deep --strict "$app"
          codesign --verify --strict "dist/AI-Prono-Coach-$VERSION.dmg"
          hdiutil verify "dist/AI-Prono-Coach-$VERSION.dmg"
      - name: Compute SHA-256
        working-directory: dist
        run: shasum -a 256 "AI-Prono-Coach-$VERSION.dmg" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            dist/AI-Prono-Coach-${{ steps.version.outputs.version }}.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
