name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check project and tag versions
        run: python .github/scripts/check_version.py
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check shell and JavaScript syntax
        run: |
          bash -n install.sh scripts/prono scripts/build-macos-dmg.sh
          for asset in src/prono/assets/*.js; do node --check "$asset"; done

  test:
    name: Tests Python ${{ matrix.python-version }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install engine with MCP
        run: python -m pip install -e '.[mcp]'
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
